name: Keep Render Service Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Intentra Render Health Endpoint
        run: |
          curl -s https://intentra-jvd1.onrender.com/api/health || true
          echo "Keep-alive ping sent to Intentra on Render at $(date)"
